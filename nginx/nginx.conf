worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;
    
    # Limite maximo do corpo da requisicao (10MB) para evitar upload de arquivos gigantes
    client_max_body_size 10M;
    
    # Compressão para melhorar performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Preserva o protocolo original se vier de túnel/proxy (como ngrok)
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    upstream nextjs_upstream {
        server app:3000;
    }

    server {
        listen 80;
        server_name localhost; # Depois você altera para seu-dominio.com

        # Redireciona tudo para o Next.js
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_cache_bypass $http_upgrade;
        }

        # Cache agressivo para os arquivos estáticos do Next
        location /_next/static {
            proxy_pass http://nextjs_upstream;
            proxy_cache_valid 60m;
            expires 365d;
            access_log off;
        }

        # Cache para a pasta public
        location /public {
            proxy_pass http://nextjs_upstream;
            expires 365d;
            access_log off;
        }
    }
}
